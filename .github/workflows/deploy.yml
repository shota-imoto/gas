name: Deploy GAS project

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Deploy対象のディレクトリ'
        required: true
        type: choice
        options:
          - family-bot
          - band-bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Write clasp credentials
        run: echo "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}

      - name: Push to Apps Script
        working-directory: ${{ inputs.project }}
        run: npx clasp push -f

      - name: Deploy
        working-directory: ${{ inputs.project }}
        env:
          DEPLOYMENT_IDS: ${{ secrets.DEPLOYMENT_IDS }}
        run: |
          deployment_id=$(echo "$DEPLOYMENT_IDS" | jq -r --arg p "${{ inputs.project }}" '.[$p]')
          npx clasp deploy -i "$deployment_id" --description "GitHub Actions: ${{ github.sha }}" --json > /dev/null
          echo "Deployed ${{ inputs.project }}" >> "$GITHUB_STEP_SUMMARY"
