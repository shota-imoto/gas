name: Deploy GAS project

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Deploy対象のディレクトリ'
        required: true
        type: choice
        options:
          - family-bot
          - band-bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Write clasp credentials
        run: echo "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}

      - name: Push to Apps Script
        working-directory: ${{ inputs.project }}
        run: npx clasp push -f

      - name: Deploy
        id: deploy
        working-directory: ${{ inputs.project }}
        run: |
          deployment_id=$(jq -r '.deploymentId' .clasp.json)
          npx clasp deploy -i "$deployment_id" --description "GitHub Actions: ${{ github.sha }}" --json
          url="https://script.google.com/macros/s/$deployment_id/exec"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed ${{ inputs.project }}" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
